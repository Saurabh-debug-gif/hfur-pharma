<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard | Hfur Pharma</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <link rel="stylesheet"
          th:href="@{/css/customer-dashboard.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="dashboard">

    <div class="container">

        <div class="welcome-card">

            <h2>

                Welcome,

                <span id="customerName"></span>

                👋

            </h2>

            <p>

                Welcome to your Hfur Pharma dashboard.

            </p>

        </div>

        <div class="row mt-5">

            <div class="col-lg-3 col-md-6 mb-4">

                <a href="/medicines" class="dashboard-card">

                    <i class="fa-solid fa-capsules"></i>

                    <h5>

                        Browse Medicines

                    </h5>

                </a>

            </div>

            <div class="col-lg-3 col-md-6 mb-4">

                <a href="/customer/cart" class="dashboard-card">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <h5>

                        My Cart

                    </h5>

                </a>

            </div>

            <div class="col-lg-3 col-md-6 mb-4">

                <a href="/customer/orders" class="dashboard-card">

                    <i class="fa-solid fa-box"></i>

                    <h5>

                        My Orders

                    </h5>

                </a>

            </div>

            <div class="col-lg-3 col-md-6 mb-4">

                <a href="#" class="dashboard-card">

                    <i class="fa-solid fa-user"></i>

                    <h5>

                        Profile

                    </h5>

                </a>

            </div>

        </div>

    </div>

</section>
<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/customer-dashboard.js}"></script>

</body>

</html>
