<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="toast">

    <div

            class="toast-container position-fixed top-0 end-0 p-3"

            style="z-index:9999;">

        <div

                id="globalToast"

                class="toast align-items-center border-0"

                role="alert">

            <div class="d-flex">

                <div

                        id="toastBody"

                        class="toast-body">

                </div>

                <button

                        type="button"

                        class="btn-close me-2 m-auto"

                        data-bs-dismiss="toast">

                </button>

            </div>

        </div>

    </div>

</div>

</html>
