<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Utility bar: contact numbers. Purely additive markup — no IDs here, so navbar.js is unaffected -->
<div class="topbar d-none d-sm-block">
    <div class="container d-flex justify-content-end">
        <a href="tel:+919004541136">
            <i class="fa-solid fa-phone"></i>
            +91 90045 41136
        </a>
        <a class="topbar-wa" href="https://wa.me/918693030619" target="_blank" rel="noopener">
            <i class="fa-brands fa-whatsapp"></i>
            +91 86930 30619
        </a>
        <a href="mailto:hfurpharma@gmail.com">
            <i class="fa-solid fa-envelope"></i>
            hfurpharma@gmail.com
        </a>
    </div>
</div>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">

            <img src="/images/logo.png"
                 th:src="@{/images/logo.png}"
                 class="brand-logo"
                 alt="Hfur Pharma"
                 onerror="this.classList.add('d-none');this.nextElementSibling.classList.remove('d-none')">

            <span class="brand-fallback d-none" aria-hidden="true">
                <span class="fallback-mark">H</span>
            </span>

            <span class="brand-wordmark" aria-label="Hfur Pharma">
                HFUR <strong>PHARMA</strong>
            </span>

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Open navigation menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/medicines">
                        Medicines
                    </a>
                </li>

                <li class="nav-item" id="enquiryNav">
                    <a class="nav-link nav-icon-link" href="/#contactForm">
                        <svg class="nav-item-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.7 3.6c-.65.5-1.6.04-1.6-.78V15.7A2.5 2.5 0 0 1 4 14V5.5Z"/>
                            <path d="M8 7.5h8M8 11h5"/>
                        </svg>
                        <span>Enquiry</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-icon-link" href="/#location">
                        <svg class="nav-item-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 10c0 5.2-8 11-8 11S4 15.2 4 10a8 8 0 1 1 16 0Z"/>
                            <circle cx="12" cy="10" r="2.5"/>
                        </svg>
                        <span>Location</span>
                    </a>
                </li>

                <!-- Before Login -->
                <li class="nav-item" id="loginNav">
                    <a class="nav-link" href="/login">
                        Login
                    </a>
                </li>

                <li class="nav-item" id="registerNav">
                    <a class="nav-link" href="/register">
                        Register
                    </a>
                </li>

                <!-- After Login -->
                <li class="nav-item d-none" id="dashboardNav">
                    <a class="nav-link" id="dashboardLink">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item d-none" id="logoutNav">
                    <a class="nav-link" href="#" onclick="logout()">
                        Logout
                    </a>
                </li>

                <li class="nav-item contact-nav-item">
                    <a class="nav-link contact-cta" href="/#contact">
                        <svg class="nav-item-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7.2 3.8 9.7 8l-2 2a15.6 15.6 0 0 0 6.3 6.3l2-2 4.2 2.5c.4.25.62.72.52 1.18l-.45 2.05A2.5 2.5 0 0 1 17.83 22C9.09 22 2 14.91 2 6.17a2.5 2.5 0 0 1 1.97-2.44l2.05-.45c.46-.1.93.11 1.18.52Z"/>
                        </svg>
                        <span>Contact Us</span>
                    </a>
                </li>

            </ul>
        </div>

    </div>

</nav>

<!-- Floating contact widget: fixed position, purely visual, no IDs — cannot interfere with any JS -->
<div class="floating-contact">
    <a href="https://wa.me/918693030619" target="_blank" rel="noopener" class="fc-btn fc-wa" aria-label="Chat on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
    <a href="tel:+919004541136" class="fc-btn fc-call" aria-label="Call us">
        <i class="fa-solid fa-phone"></i>
    </a>
</div>

</body>
</html>
