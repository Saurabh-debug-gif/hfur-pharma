<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register | Hfur Pharma</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

    <style>
        body{ background:#f4f7fb; font-family:'Inter', sans-serif; }
        section.container.py-5.mt-5{ padding-top:4rem !important; }
    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="container py-5 mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="card shadow">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-plus fa-2x mb-2" style="color:#12a463;"></i>
                        <h2 class="mb-1">

                            Create Account

                        </h2>
                        <p class="text-muted" style="font-size:14.5px;">Join Hfur Pharma to start ordering</p>
                    </div>

                    <form id="registerForm">

                        <div class="mb-3">

                            <input
                                    id="name"
                                    class="form-control"
                                    placeholder="Full Name"
                                    required>

                        </div>

                        <div class="mb-3">

                            <input
                                    id="email"
                                    type="email"
                                    class="form-control"
                                    placeholder="Email"
                                    required>

                        </div>

                        <div class="mb-3">

                            <input
                                    id="password"
                                    type="password"
                                    class="form-control"
                                    placeholder="Password"
                                    required>

                        </div>

                        <input type="hidden" id="role" value="CUSTOMER">

                        <button
                                class="btn btn-success w-100"
                                type="submit">

                            Register

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        Already have an account?

                        <a th:href="@{/login}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/register.js}"></script>

</body>

</html>
