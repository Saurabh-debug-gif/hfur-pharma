<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Hfur Pharma</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<div class="login-container">

    <div class="login-left">

        <a th:href="@{/}" class="login-logo-link">
            <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hfur Pharma logo">
                <rect width="40" height="40" rx="12" fill="url(#loginLogoGrad)"/>
                <path d="M12 28V12h3.4v6.3h9.2V12H28v16h-3.4v-6.4h-9.2V28H12Z" fill="#ffffff"/>
                <circle cx="31" cy="9" r="4.2" fill="#D4A94F"/>
                <defs>
                    <linearGradient id="loginLogoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0F7A4C"/>
                        <stop offset="1" stop-color="#1ABC7B"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="login-logo-word">Hfur<span>Pharma</span></span>
        </a>

        <h1>

            Welcome Back

        </h1>

        <p>

            Login to continue to Hfur Pharma.

        </p>

        <form id="loginForm">

            <div class="mb-3">

                <label>Email</label>

                <input

                        id="email"

                        type="email"

                        class="form-control"

                        required>

            </div>

            <div class="mb-4">

                <label>Password</label>

                <div class="password-box">

                    <input

                            id="password"

                            type="password"

                            class="form-control"

                            required>

                    <i

                            id="togglePassword"

                            class="fa-solid fa-eye">

                    </i>

                </div>

            </div>

            <button

                    id="loginBtn"

                    class="btn btn-success w-100">

                Login

            </button>

        </form>

        <div class="text-center mt-4">

            Don't have an account?

            <a th:href="@{/register}">

                Register

            </a>

        </div>

        <div class="text-center mt-4" style="font-size:13.5px;">

            Need help? Call

            <a href="tel:+919004541136">+91 90045 41136</a>

            or

            <a href="https://wa.me/918693030619" target="_blank" rel="noopener">WhatsApp us</a>

            or email

            <a href="mailto:hfurpharma@gmail.com">hfurpharma@gmail.com</a>

        </div>

    </div>

    <div class="login-right">

        <img

                th:src="@{/images/login-banner.png}"

                class="banner">

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/login.js}"></script>

</body>

</html>
