<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Dashboard | Hufur Pharma</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link
            rel="stylesheet"
            th:href="@{/css/navbar.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/admin-dashboard.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="dashboard py-5">

    <div class="container">

        <div class="mb-5">

            <h2>

                Welcome,

                <span id="adminName">

                    Admin

                </span>

                👋

            </h2>

            <p class="text-muted">

                Manage medicines, orders and medical representatives from one place.

            </p>

        </div>

        <div class="row g-4">

            <!-- Medicines -->

            <div class="col-lg-3 col-md-6">

                <a
                        href="/admin/medicines"
                        class="dashboard-card">

                    <i class="fa-solid fa-capsules"></i>

                    <h5>

                        Medicine Management

                    </h5>

                    <small>

                        Add • Edit • Delete • Stock

                    </small>

                </a>

            </div>

            <!-- Orders -->

            <div class="col-lg-3 col-md-6">

                <a
                        href="/admin/orders"
                        class="dashboard-card">

                    <i class="fa-solid fa-box"></i>

                    <h5>

                        Order Management

                    </h5>

                    <small>

                        Customer Orders

                    </small>

                </a>

            </div>

            <!-- MR -->

            <div class="col-lg-3 col-md-6">

                <a
                        href="/admin/mr"
                        class="dashboard-card">

                    <i class="fa-solid fa-user-doctor"></i>

                    <h5>

                        Medical Representatives

                    </h5>

                    <small>

                        Create • Visits • Tracking

                    </small>

                </a>

            </div>

            <!-- Stock -->

            <div class="col-lg-3 col-md-6">

                <a
                        href="/admin/medicines"
                        class="dashboard-card">

                    <i class="fa-solid fa-boxes-stacked"></i>

                    <h5>

                        Stock Management

                    </h5>

                    <small>

                        Update Inventory

                    </small>

                </a>

            </div>

        </div>

    </div>

</section>
<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/admin-dashboard.js}"></script>

</body>

</html>
