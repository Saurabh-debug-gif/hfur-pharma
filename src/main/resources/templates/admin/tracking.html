<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>MR Tracking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin-tracking.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="container py-5 mt-5">

    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
        <div>
            <span class="tracking-kicker">Field monitoring</span>
            <h2 class="mb-1">Medical Representative Tracking</h2>
            <p class="text-muted mb-0" id="trackingMessage">Latest location refreshes automatically.</p>
        </div>

        <button type="button" class="btn btn-outline-success" id="refreshTrackingBtn">
            <i class="fa-solid fa-rotate"></i> Refresh now
        </button>
    </div>

    <div class="card shadow">

        <div class="card-body">

            <h4>

                Latest Location

            </h4>

            <hr>

            <p>

                <strong>Latitude:</strong>

                <span id="latitude">-</span>

            </p>

            <p>

                <strong>Longitude:</strong>

                <span id="longitude">-</span>

            </p>

            <p>

                <strong>Last Updated:</strong>

                <span id="time">-</span>

            </p>

            <a id="latestMapLink" class="btn btn-success d-none" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-map-location-dot"></i> Open latest location in Maps
            </a>

        </div>

    </div>

    <div class="mt-4">

        <h4>

            Location History

        </h4>

        <div class="table-responsive">

            <table class="table table-bordered">

                <thead class="table-success">

                <tr>

                    <th>Latitude</th>

                    <th>Longitude</th>

                    <th>Date & Time</th>

                    <th>Map</th>

                </tr>

                </thead>

                <tbody id="historyTable">

                </tbody>

            </table>

        </div>

    </div>

</section>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/admin-tracking.js}"></script>

</body>

</html>
