<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Medicine Management | Hufur Pharma</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link
            rel="stylesheet"
            th:href="@{/css/navbar.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/admin-medicine.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="container py-5 mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <span class="page-kicker">Inventory &amp; catalogue</span>
            <h2 class="mb-1">Medicine Management</h2>
            <p class="text-muted mb-0">Add, edit and safely update medicine stock.</p>
        </div>

        <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#medicineModal"
                id="addMedicineButton">

            <i class="fa-solid fa-plus"></i>

            Add Medicine

        </button>

    </div>

    <div class="row mb-4">

        <div class="col-lg-5">

            <input

                    id="searchMedicine"

                    class="form-control"

                    placeholder="Search Medicine...">

        </div>

    </div>

    <div class="table-responsive">

        <table class="table table-hover table-bordered align-middle">

            <thead class="table-success">

            <tr>

                <th>Image</th>

                <th>Name</th>

                <th>Brand</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Description</th>

                <th width="190">Actions</th>

            </tr>

            </thead>

            <tbody id="medicineTable">

            </tbody>

        </table>

    </div>

</section>

<!-- ===========================
        MODAL
=========================== -->

<div class="modal fade"

     id="medicineModal"

     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h4 id="modalTitle">

                    Add Medicine

                </h4>

                <button

                        class="btn-close"

                        data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <form id="medicineForm">

                    <!-- Hidden Medicine Id -->

                    <input

                            type="hidden"

                            id="medicineId">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="name" class="form-label">Medicine name</label>

                            <input

                                    id="name"

                                    class="form-control"

                                    placeholder="Medicine Name"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="brand" class="form-label">Brand</label>

                            <input

                                    id="brand"

                                    class="form-control"

                                    placeholder="Brand"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="price" class="form-label">Price</label>

                            <input

                                    id="price"

                                    type="number"

                                    min="0"

                                    step="0.01"

                                    class="form-control"

                                    placeholder="Price"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="stock" class="form-label">Opening/current stock</label>

                            <input

                                    id="stock"

                                    type="number"

                                    min="0"

                                    step="1"

                                    class="form-control"

                                    placeholder="Stock"

                                    required>

                        </div>

                        <div class="col-12 mb-3">

                            <label for="description" class="form-label">Description</label>

                            <textarea

                                    id="description"

                                    rows="4"

                                    class="form-control"

                                    placeholder="Add the medicine description"

                                    required></textarea>

                            <small class="text-muted">Long descriptions are supported.</small>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="category" class="form-label">Category</label>

                            <select

                                    id="category"

                                    class="form-control"

                                    required>

                                <option value="">Select category</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="image" class="form-label">Medicine image</label>

                            <input

                                    id="image"

                                    type="file"

                                    class="form-control">

                            <small class="text-muted">

                                Leave empty while editing to keep existing image.

                            </small>

                        </div>

                        <div class="col-12 mb-4">

                            <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
                                <div>
                                    <label class="form-label mb-0">Custom attributes</label>
                                    <small class="text-muted d-block">Optional details such as dosage form, strength or pack size.</small>
                                </div>

                                <button type="button" class="btn btn-outline-success btn-sm" id="addAttributeButton">
                                    <i class="fa-solid fa-plus"></i> Add attribute
                                </button>
                            </div>

                            <div id="customAttributes" class="attribute-list"></div>

                        </div>

                    </div>

                    <button

                            class="btn btn-success w-100"

                            id="saveMedicineButton"

                            type="submit">

                        Save Medicine

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/admin-medicine.js}"></script>

</body>

</html>
