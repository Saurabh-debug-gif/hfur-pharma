<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Medicine Management | Hufur Pharma</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link
            rel="stylesheet"
            th:href="@{/css/navbar.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/admin-medicine.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="container py-5 mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Medicine Management</h2>

        <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#medicineModal">

            <i class="fa-solid fa-plus"></i>

            Add Medicine

        </button>

    </div>

    <div class="row mb-4">

        <div class="col-lg-5">

            <input

                    id="searchMedicine"

                    class="form-control"

                    placeholder="Search Medicine...">

        </div>

    </div>

    <div class="table-responsive">

        <table class="table table-hover table-bordered align-middle">

            <thead class="table-success">

            <tr>

                <th>Image</th>

                <th>Name</th>

                <th>Brand</th>

                <th>Price</th>

                <th>Stock</th>

                <th width="180">Action</th>

            </tr>

            </thead>

            <tbody id="medicineTable">

            </tbody>

        </table>

    </div>

</section>

<!-- ===========================
        MODAL
=========================== -->

<div class="modal fade"

     id="medicineModal"

     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h4 id="modalTitle">

                    Add Medicine

                </h4>

                <button

                        class="btn-close"

                        data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <form id="medicineForm">

                    <!-- Hidden Medicine Id -->

                    <input

                            type="hidden"

                            id="medicineId">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <input

                                    id="name"

                                    class="form-control"

                                    placeholder="Medicine Name"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <input

                                    id="brand"

                                    class="form-control"

                                    placeholder="Brand"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <input

                                    id="price"

                                    type="number"

                                    class="form-control"

                                    placeholder="Price"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <input

                                    id="stock"

                                    type="number"

                                    class="form-control"

                                    placeholder="Stock"

                                    required>

                        </div>

                        <div class="col-12 mb-3">

                            <textarea

                                    id="description"

                                    rows="4"

                                    class="form-control"

                                    placeholder="Description">

                            </textarea>

                        </div>

                        <div class="col-md-6 mb-3">

                            <input

                                    id="category"

                                    type="number"

                                    class="form-control"

                                    placeholder="Category Id"

                                    required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <input

                                    id="image"

                                    type="file"

                                    class="form-control">

                            <small class="text-muted">

                                Leave empty while editing to keep existing image.

                            </small>

                        </div>

                    </div>

                    <button

                            class="btn btn-success w-100"

                            type="submit">

                        Save Medicine

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:src="@{/js/navbar.js}"></script>

<script th:src="@{/js/admin-medicine.js}"></script>

</body>

</body>

</html>
